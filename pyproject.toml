[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "orion-phi-4"
version = "1.0.0"
description = "Multi-Agent AI Trading System with Quantum-inspired algorithms"
readme = "README.md"
requires-python = ">=3.9"
license = {text = "MIT"}
authors = [
    {name = "Orion Nexus Prime", email = "info@orion-nexus.ai"}
]
keywords = ["trading", "ai", "multi-agent", "quantum", "finance"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Financial and Insurance Industry",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Topic :: Office/Business :: Financial :: Investment",
]

dependencies = [
    "torch>=2.0.0",
    "numpy>=1.24.0",
    "pandas>=2.0.0",
    "scikit-learn>=1.3.0",
    "asyncio>=3.4.3",
    "aiohttp>=3.8.0",
    "websockets>=11.0",
    "pyyaml>=6.0",
    "python-dotenv>=1.0.0",
    "pydantic>=2.0.0",
    "structlog>=23.1.0",
    "colorlog>=6.7.0",
    "ccxt>=4.0.0",
    "yfinance>=0.2.0",
    "cryptography>=41.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4.0",
    "pytest-asyncio>=0.21.0",
    "pytest-cov>=4.1.0",
    "black>=23.0.0",
    "flake8>=6.0.0",
    "mypy>=1.4.0",
]
gpu = [
    "cupy-cuda12x>=12.0.0",
]
voice = [
    "pyttsx3>=2.90",
    "SpeechRecognition>=3.10.0",
]

[project.urls]
Homepage = "https://github.com/Orion-Nexus-prime/Orion-phi-4"
Repository = "https://github.com/Orion-Nexus-prime/Orion-phi-4"
Issues = "https://github.com/Orion-Nexus-prime/Orion-phi-4/issues"

[tool.setuptools]
package-dir = {"" = "."}

[tool.setuptools.packages.find]
where = ["."]
include = ["src*"]

[tool.black]
line-length = 100
target-version = ['py39', 'py310', 'py311']

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = "test_*.py"
python_classes = "Test*"
python_functions = "test_*"
asyncio_mode = "auto"
